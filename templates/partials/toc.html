{# Jump register: every ## heading with its ### headings nested below. Expects `toc`. #}
<ol class="toc-list">
  {% for h in toc %}
  <li><a href="#{{ h.id }}">{{ h.title }}</a>
    {% if h.children %}
    <ol>
      {% for c in h.children %}
      <li><a href="#{{ c.id }}">{{ c.title }}</a></li>
      {% endfor %}
    </ol>
    {% endif %}
  </li>
  {% endfor %}
</ol>
