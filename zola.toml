# Site config for resux.xyz (Zola 0.23)
base_url = "https://resux.xyz"
title = "resux1338"
description = "resux1338 - infosec."
default_language = "en"
author = "resux"

compile_sass = false
minify_html = true
build_search_index = false

# Zola runs its template engine over Markdown too. Off for writeups and Goodies, so
# payloads like {{7*7}} are published as written instead of being evaluated.
skip_content_templating = ["writeups/**", "goodies.md"]

# Atom feed of all writeups at /atom.xml
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
external_links_target_blank = true
external_links_no_referrer = true
bottom_footnotes = true
# Headings keep their ids for deep links but get no visible anchor marker
insert_anchor_links = "none"

[markdown.highlighting]
# Writes giallo-light.css and giallo-dark.css at build time (classes z-l-* / z-d-*).
# base.html loads one or the other by prefers-color-scheme; backgrounds and a few
# low-contrast token colours are overridden in static/css/site.css
light_theme = "github-light"
dark_theme = "github-dark"
style = "class"

[extra]
handle = "resux"
avatar_alt = "resux avatar: a plush cat in a wizard hat with glowing blue eyes"
email = "resuxinfo@proton.me"

# PGP row under Contact on the About page; links to static/pgp.asc.
# Comment the next line out to hide the row.
pgp_fingerprint = "D461 2B91 BF55 FFD9 6D9C A024 ECCC 09E7 D6A9 2575"

# Extra rows under Contact on the About page, after Email, PGP and GitHub
contact_rows = [
  { name = "CV, LinkedIn", value = "On request" },
]

# Certifications table on the About page
certs = [
  { name = "OSCP+", note = "2026" },
  { name = "CRTP", note = "in progress" },
]

# Hack The Box table on the About page. Remove htb_rank to hide the whole section.
htb_rank = "Elite Hacker · Grandmaster"
htb_stats = [
  { name = "Machines", value = "186" },
  { name = "Fortresses", value = "6/6" },
  { name = "Challenges", value = "69" },
]
htb_labs = { label = "Pro Labs", items = ["P.O.O", "Xen"] }

# External links in the header nav, in this order (after Writeups and About, before RSS).
# The About page looks up "GitHub" and "HTB" here by name for its own links.
links = [
  { name = "GitHub", url = "https://github.com/resux1338" },
  { name = "HTB", url = "https://app.hackthebox.com/public/users/2155210" },
]

# Path to an Impressum page, e.g. "@/impressum.md". Footer link appears once set.
# impressum = "@/impressum.md"

# How the lower-case platform / os / difficulty values from writeup front matter are
# shown in meta lines. Values missing here are shown as written.
# Keep this table last: any key below it would land inside it.
[extra.display_names]
hacksmarter = "HackSmarter"
htb = "Hack The Box"
ctf = "CTF"
windows = "Windows"
linux = "Linux"
easy = "Easy"
medium = "Medium"
hard = "Hard"
insane = "Insane"
